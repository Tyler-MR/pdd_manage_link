services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: link-management-api
    restart: unless-stopped
    env_file:
      - ../.env
    expose:
      - "8090"
    ports:
      - "127.0.0.1:8092:8090"
    environment:
      PROFIT_API_PORT: 8090
      PROFIT_DELIST_FILE: /app/data/delist_tasks.json
      PROFIT_ADJUST_FILE: /app/data/promotion_adjust_tasks.json
      PROFIT_OPERATION_FILE: /app/data/operation_tasks.json
    volumes:
      - ../link_management_delist_tasks.json:/app/data/delist_tasks.json
      - ../link_management_promotion_adjust_tasks.json:/app/data/promotion_adjust_tasks.json
      - ../link_management_operation_tasks.json:/app/data/operation_tasks.json
    networks:
      - link-management

  web:
    image: nginx:alpine
    container_name: link-management-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ../profit-dashboard-vue/dist:/usr/share/nginx/html:ro
      - ./nginx-link-management.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - link-management

networks:
  link-management:
    name: link-management-network
